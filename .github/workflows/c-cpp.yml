name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: make
      run: make
    - name: run
      run: ./mdt-eepy-llm
    - name: upload
      uses: actions/upload-artifact@v4
      with:
        name: mdt-eepy-llm
        path: ./mdt-eepy-llm
